[platformio]
default_envs = nodemcuv2, d1_mini

[env]
platform = espressif8266@4.2.1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@6.21.5
  links2004/WebSockets@2.6.1

[env:nodemcuv2]
board = nodemcuv2
build_flags = -DBOARD_PROFILE_NODEMCU

[env:d1_mini]
board = d1_mini
build_flags = -DBOARD_PROFILE_D1_MINI
